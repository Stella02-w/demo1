<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarbonTrace Supplier Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mut:#6e6e73;--dim:#8e8e93;--line:#e5e5ea;--line2:#d2d2d7;--acc:#0a6ebd;--accbg:#eaf3fb;--ok:#1e7b34;--okbg:#e6f4ea;--warn:#8a5300;--warnbg:#fff4e0;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{height:58px;display:flex;align-items:center;gap:16px;background:var(--card);border-bottom:1px solid var(--line);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
header .b{font-weight:600;letter-spacing:-.015em}header .b span{color:var(--mut);font-weight:500}
header .org{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:11px;font-weight:700}
.pill{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--warnbg);color:var(--warn);font-weight:500;text-decoration:none}
.lay{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 58px)}
aside{background:var(--card);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:6px}
.k{font-size:12px;color:var(--dim);font-weight:500}
.ib{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:10px;border:1px solid var(--acc);background:var(--accbg)}
.ib b{font-weight:600;font-size:13.5px}.ib span{font-size:12px;color:var(--mut)}
.none{color:var(--mut);font-size:13px;padding:12px 4px}
main{min-width:0;padding:28px clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:20px;max-width:980px}
.stp{display:flex;gap:6px;flex-wrap:wrap}
.stp span{font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--mut)}
.stp span.d{background:var(--okbg);border-color:transparent;color:var(--ok)}.stp span.on{background:var(--acc);border-color:var(--acc);color:#fff}
h1{font-size:26px;letter-spacing:-.025em;margin:0;font-weight:600;text-wrap:balance}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card p{margin:0;line-height:1.6}.card .m{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}.row:first-of-type{border-top:0}.row span{color:var(--mut)}.row b{font-weight:500;text-align:right}
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ops label{display:flex;gap:12px;padding:16px;border-radius:12px;border:1px solid var(--line2);background:var(--card);cursor:pointer;line-height:1.5}
.ops label.on{border:2px solid var(--acc);padding:15px}
.ops input{accent-color:var(--acc);margin-top:3px}.ops small{display:block;color:var(--mut);font-size:12.5px}
.file{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px dashed var(--line2);border-radius:10px;font-size:13px}
.file svg{flex:none;color:var(--acc)}.file b{font-weight:500}.file span{color:var(--mut);margin-left:auto;font-size:12px}
.fl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut)}
input.i,textarea.i{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:9px;padding:9px 11px}
textarea.i{min-height:80px;resize:vertical}
.ab{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.btn{border:0;border-radius:10px;padding:11px 20px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn2{border:1px solid var(--line2);border-radius:10px;padding:10px 18px;background:#fff;color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.4;cursor:default}
.ok{display:flex;gap:12px;align-items:flex-start}.ok i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.ok i.w{background:var(--warn)}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:80px 20px;color:var(--mut)}
@media (max-width:860px){.lay{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.ops,.fl{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lst{margin:0;padding-left:18px;line-height:1.7;font-size:13.5px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><span class="b">CarbonTrace <span>Supplier Portal</span></span><span class="org"><a class="pill" href="review.html#CL-X-PCF">Simulated · back to JLR</a><span class="av">SB</span>Supplier B</span></header>
<div class="lay"><aside id="inbox"></aside><main id="m"></main></div>
<script type="module" src="../src/portal.js"></script>
</body>
</html>
