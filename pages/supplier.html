<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarbonTrace Supplier Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../src/ui.css">
<link rel="stylesheet" href="../src/pages.css">
<style>
/* Layout: top bar; inbox list (left) and the open request (right); stacks on phones */
.portal{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}
.acct{display:flex;align-items:center;gap:10px}
.acct select{min-width:220px}
.item{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;margin-top:8px;transition:border-color .2s}
.item:hover{border-color:var(--line2)}
.item.on{border-color:rgba(255,255,255,.3);background:var(--raise)}
.item .sub{font-size:12px}
.crumb{display:flex;gap:8px;font-size:12.5px;color:var(--dim);margin-bottom:6px}.crumb a{color:var(--mut);text-decoration:none}.crumb a:hover{color:var(--ink)}
.empty{color:var(--mut);padding:24px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){.portal{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="top"></header>
<main>
  <header class="ph"><div><nav class="crumb"><a href="suppliers.html">Supplier Center</a><span>/</span><span>Portal preview</span></nav><h1>Supplier Portal</h1><div class="sub">Evidence requests from JLR. Suppliers see only what they are asked for: no targets, no other suppliers.</div></div>
    <label class="acct sub">Portal account<select class="i" id="acct" aria-label="Portal account"></select></label></header>
  <div class="portal"><section><div class="k">Requests</div><div id="list"></div></section><section id="detail"></section></div>
</main>
<script type="module" src="../src/supplier.js"></script>
</body>
</html>
