<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarbonTrace Network</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../src/ui.css">
<link rel="stylesheet" href="../src/pages.css">
<link rel="stylesheet" href="../src/chain.css">
<style>
/* Network: who is connected, what each relationship is, and what the network shows. */
main{max-width:1440px}
.nw{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.cv{min-width:0}
.cvh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cvh h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}.cvh .sub{margin:2px 0 0;font-size:12px;color:var(--dim)}
.mw{overflow-x:auto;margin-top:6px}
svg.rmap{width:100%;min-width:560px;max-height:calc(100vh - 230px);height:auto;display:block;overflow:visible}
svg.rmap text{font-family:var(--f);font-size:12.5px;fill:var(--mut);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
svg.rmap .rg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:1}
svg.rmap .rl{font-size:10.5px;fill:var(--dim);letter-spacing:.06em;text-transform:uppercase}
svg.rmap .q{font-size:11px;fill:var(--dim);font-family:var(--m)}
svg.rmap .ed{fill:none;stroke-linecap:round;transition:opacity .3s,stroke .3s}
svg.rmap .ed.c{stroke:color-mix(in srgb,var(--teal) 70%,transparent)}svg.rmap .ed.dl{stroke:rgba(255,255,255,.5)}
svg.rmap .ed.ai{stroke:var(--ai);stroke-dasharray:5 4;animation:fl 1.1s linear infinite}@keyframes fl{to{stroke-dashoffset:-18}}
svg.rmap .ed.ai.fresh{animation:fl 1.1s linear infinite,draw .9s ease-out both}@keyframes draw{from{opacity:0}}
svg.rmap .ed.un{stroke:var(--dim);stroke-dasharray:1.5 4;stroke-width:1.4}
svg.rmap .ed.d{opacity:.1}
svg.rmap .ed.fl{stroke:var(--amber);opacity:.85}
svg.rmap .pl{fill:none;stroke:#ffe0a3;stroke-width:4;stroke-linecap:round;stroke-dasharray:.09 1;stroke-dashoffset:.09;animation:pulse 1.6s cubic-bezier(.45,0,.3,1) infinite both;filter:drop-shadow(0 0 4px var(--amber))}
@keyframes pulse{0%{stroke-dashoffset:.09;opacity:0}12%{opacity:1}80%{opacity:1}100%{stroke-dashoffset:-1;opacity:0}}
svg.rmap .nd{cursor:pointer;transition:opacity .3s}svg.rmap .nd:focus{outline:none}
svg.rmap .dot{fill:#6b6f78;stroke:var(--panel);stroke-width:2;transition:fill .3s}
svg.rmap .r4 .dot{fill:#8a8f99}svg.rmap .r1 .dot{fill:#c9ccd3}
svg.rmap .nd:hover text,svg.rmap .nd:focus-visible text{fill:var(--ink)}
svg.rmap .nd.d{opacity:.25}
svg.rmap .nd.u .dot{fill:#9aa0aa}svg.rmap .nd.u text{fill:var(--ink)}
svg.rmap .nd.f .dot{fill:var(--amber)}svg.rmap .nd.f text{fill:var(--ink)}
svg.rmap .nd.sel .dot{fill:#fff;stroke:var(--amber);stroke-width:3}svg.rmap .nd.sel text{fill:var(--ink);font-weight:600}
svg.rmap .nd.w .dot{fill:var(--amber)}svg.rmap .nd.w text{fill:var(--ink)}
svg.rmap .halo{fill:none;stroke:var(--amber);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;animation:halo 1.6s ease-out infinite both}
@keyframes halo{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(1.6)}}
svg.rmap .nd.w .halo{animation-duration:2.4s}
svg.rmap .nd.aiN .dot{fill:var(--ai)}svg.rmap .nd.aiN text{fill:var(--ai)}
svg.rmap .car .hub{fill:color-mix(in srgb,var(--ink) 6%,var(--panel));stroke:rgba(255,255,255,.22);stroke-width:1.2}
svg.rmap .car text{stroke:none}svg.rmap .car .c1{font-size:11.5px;fill:var(--mut)}svg.rmap .car .c2{font-size:13px;font-weight:600;fill:var(--ink)}
svg.rmap .car.f .hub{stroke:var(--amber);stroke-width:2}svg.rmap .car.sel .hub{stroke:var(--amber);stroke-width:2.5}svg.rmap .car.d{opacity:.4}
svg.rmap .aib{cursor:pointer}svg.rmap .aib circle{fill:var(--panel);stroke:var(--ai);stroke-width:1.5}svg.rmap .aib text{fill:var(--ai);font-size:11px;stroke:none}
.lgd{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.lgd span{display:flex;align-items:center;gap:8px}
.lgd .fo{width:9px;height:9px;border-radius:50%;background:var(--amber)}
.gl{width:26px;height:8px;flex:none}.gl line{fill:none;stroke-width:2.4}
.gl .c{stroke:var(--teal)}.gl .dl{stroke:rgba(255,255,255,.5)}.gl .ai{stroke:var(--ai);stroke-dasharray:5 4}.gl .un{stroke:var(--dim);stroke-dasharray:1.5 4}
.hint{margin:6px 0 0;font-size:12px;color:var(--dim)}
#panel{position:sticky;top:112px;max-height:calc(100vh - 130px);overflow:auto;display:flex;flex-direction:column;gap:10px}
#panel .stm{margin-top:0}
.itab{margin-top:8px}.itab .chip{flex:1;font-size:12px}.itab em{font-style:normal;color:var(--dim);margin-left:2px}.itab .chip.on em{color:var(--amber)}
.irs{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.td{margin:4px 0 0;font-size:12px;color:var(--dim)}
.ir{display:grid!important;grid-template-columns:52px 1fr;column-gap:10px;row-gap:1px}.ir i{grid-row:span 2;font-style:normal;font-size:11px;color:var(--dim);padding-top:2px}
.say{display:flex;gap:10px;margin:8px 0 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--ai) 8%,transparent);border:1px solid color-mix(in srgb,var(--ai) 22%,transparent);font-size:13px;line-height:1.55;color:var(--ink)}
.say .aisym{color:var(--ai);flex:none}
.tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--mut)}
.tr span{padding:3px 9px;border-radius:7px;background:rgba(255,255,255,.05)}.tr span b{color:var(--amber);font-weight:600}
.tr .me{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--ink);font-weight:500}.tr i{font-style:normal;color:var(--dim)}
.imp{display:flex;flex-direction:column;margin-top:10px;border-top:1px solid var(--line)}
.ib{padding:11px 0;border-bottom:1px solid var(--line)}
.il{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.il b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}.il span{font-size:11.5px;color:var(--mut);text-align:right}
.il .dt{padding:1px 8px;border-radius:6px}
.ib p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--ink)}
.cl+.cl{margin-top:10px}.cl p{color:var(--mut)!important}
.ty{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px}
.ty.upstream{color:#7db7ff;background:rgba(125,183,255,.12)}.ty.joint{color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent)}
.cl .go{display:inline-block;margin-top:6px;font-size:12px;color:var(--ink);text-decoration:none;font-weight:500}.cl .go:hover{color:var(--amber)}
.lst{margin-top:6px}
.aic{display:flex;gap:10px;text-align:left;border:1px solid color-mix(in srgb,var(--ai) 40%,transparent);background:color-mix(in srgb,var(--ai) 8%,transparent);color:var(--ink);font:inherit;padding:12px 14px;border-radius:12px;cursor:pointer;margin-bottom:6px}
.aic:hover{border-color:var(--ai)}.aic .aisym{color:var(--ai)}.aic b{display:block;font-size:13px;font-weight:600}.aic em{font-style:normal;font-size:12px;color:var(--mut);line-height:1.5}
.gl2{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--amber) 45%,transparent)}.gl2 p{margin:4px 0 0;font-size:12.5px;line-height:1.55;color:var(--ink)}.gl2 .go{display:inline-block;margin-top:6px;font-size:12px;color:var(--ink);text-decoration:none;font-weight:500}.gl2 .go:hover{color:var(--amber)}
.ir{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;transition:border-color .2s,background .2s}
.ir:hover{border-color:var(--line2)}.ir.on{border-color:color-mix(in srgb,var(--amber) 50%,transparent);background:color-mix(in srgb,var(--amber) 5%,transparent)}
.ir b{font-size:13px;font-weight:600}.ir span{font-size:12px;color:var(--mut)}
.irs .go{font-size:12px;color:var(--mut);text-decoration:none;margin:-2px 0 6px 12px}.irs .go:hover{color:var(--ink)}
.ins{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .2s}
.ins:hover{border-color:var(--line2)}
.ins .go{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--ink);text-decoration:none;font-weight:500}.ins .go:hover{color:var(--amber)}.ins.on{cursor:default;border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 4%,transparent)}
.ins .it{display:flex;gap:8px;font-size:11.5px;color:var(--dim)}.ins .it em{font-style:normal;color:var(--amber);font-weight:600}
.ins h3{margin:4px 0 0;font-size:14px;font-weight:600;line-height:1.4;letter-spacing:-.01em}
.ins p{margin:8px 0 0;font-size:12.5px;color:var(--mut);line-height:1.55}
.why{margin-top:10px;font-size:12.5px;color:var(--mut);line-height:1.55}.why b{display:block;color:var(--ink);font-weight:500;font-size:12px;margin-bottom:2px}
.ins .acts{margin-top:12px}.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn,.acts .btn2{width:auto;margin:0;padding:8px 14px}
.fine{margin:2px 0 0;font-size:11.5px;color:var(--dim);line-height:1.5}
.bk{align-self:flex-start;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;padding:0;cursor:pointer}.bk:hover{color:var(--ink)}
.pf{display:flex;flex-direction:column;gap:6px}
.pf h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em}
.pf>.k{margin-top:10px}.pf>.k:first-child{margin-top:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tg{font-size:11.5px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--mut)}
.s-confirmed{color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent)}.s-ai{color:var(--ai);background:color-mix(in srgb,var(--ai) 14%,transparent)}.s-declared{color:var(--ink)}
.kv{display:flex;flex-direction:column;margin-top:6px}.kv div{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.kv span{color:var(--dim)}.kv b{font-weight:500}
.cp{display:flex;flex-direction:column;gap:4px}
.cp button,.cp .un{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:rgba(255,255,255,.035);border-radius:9px;padding:8px 10px;color:var(--ink);font:inherit;cursor:pointer}
.cp .un{cursor:default;grid-template-columns:26px 1fr}
.cp button:hover{background:rgba(255,255,255,.07)}
.cp b{display:block;font-size:12.5px;font-weight:500}.cp em{font-style:normal;font-size:11.5px;color:var(--dim)}.cp i{font-style:normal;font-size:11px;color:var(--mut)}
.evl{display:flex;flex-direction:column}.evl div{display:flex;flex-direction:column;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}.evl b{font-weight:500;font-family:var(--m);font-size:11.5px}.evl span{color:var(--mut);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line2);background:none;color:var(--ink);font:inherit;font-size:12px;padding:4px 10px;border-radius:8px;cursor:pointer}.chips button:hover{background:rgba(255,255,255,.06)}
.nx{margin:0;font-size:12.5px;color:var(--mut);line-height:1.55;display:flex;gap:8px;align-items:center}
.pf .btn{margin-top:8px}
.ends{display:flex;gap:8px;margin-top:10px}.ends .btn2{margin:0}
@media (max-width:1100px){.nw{grid-template-columns:1fr}#panel{position:static;max-height:none}}
</style>
</head>
<body>
<header id="top"></header>
<main>
  <div class="nw">
    <section class="card cv" id="cv"></section>
    <aside class="card" id="panel"></aside>
  </div>
</main>
<script type="module" src="../src/netview.js"></script>
</body>
</html>
