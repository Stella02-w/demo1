<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarbonTrace Evidence Registry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../src/ui.css">
<link rel="stylesheet" href="../src/pages.css">
<style>
/* Evidence Center: a review inbox built for volume. Tabs by state -> filters -> list on the left, the open item's checks on the right. */
main{max-width:1320px}
.kp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.views{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.views button{border:0;background:none;padding:10px 12px;color:var(--mut);font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.views button.on{color:var(--ink);border-bottom-color:var(--accent)}
.views em{font-style:normal;color:var(--dim);margin-left:6px;font-variant-numeric:tabular-nums}
.fb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.fb .i{padding:7px 10px;font-size:12.5px}.fb input.i{flex:1;min-width:200px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.list{padding:6px 18px 14px}
table.t tr.r{cursor:pointer;transition:background .15s}table.t tr.r:hover{background:rgba(255,255,255,.03)}table.t tr.r.on{background:rgba(255,255,255,.07)}
table.t td{vertical-align:middle}
.nm b{font-weight:500}.nm .sub{font-size:11.5px}
.smp{font-size:10.5px;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 4px;margin-left:6px}
.sla{font-size:12px;font-variant-numeric:tabular-nums}
.pg{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--mut);font-size:12.5px;padding-top:10px}
.pg button{border:1px solid var(--line2);background:none;color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}.pg button:disabled{opacity:.35;cursor:default}
#detail{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto}
.chk{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.chk i{width:14px;height:14px;border-radius:50%;margin-top:2px;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:700;color:#0a0a0b}
.chk i.y{background:var(--teal)}.chk i.n{background:var(--red)}.chk i.m{background:var(--amber)}
.chk .sub{font-size:11.5px}
.doc{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:12px;background:rgba(255,255,255,.02)}
.doc svg{flex:none;color:var(--mut)}
.acts{display:flex;gap:8px;margin-top:14px}.acts .btn,.acts .btn2{margin:0}
.foot{color:var(--dim);font-size:12px}
@media (max-width:1080px){.split{grid-template-columns:1fr}#detail{position:static;max-height:none}.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.hide-n{display:none}}
</style>
</head>
<body>
<header id="top"></header>
<main>
  <header class="ph"><div><h1>Evidence registry</h1></div></header>
  <section class="kp" id="kp"></section>
  <section class="card" style="padding:6px 18px 14px">
    <div class="views" id="views"></div>
    <div class="fb">
      <input class="i" id="q" type="search" placeholder="Search supplier, evidence ID or request" aria-label="Search evidence">
      <select class="i" id="fMat" aria-label="Material"></select>
      <select class="i" id="fClaim" aria-label="Claim"><option value="">All claims</option><option value="recycled_share">Recycled share</option><option value="primary_pcf">Primary PCF</option><option value="origin_link">Origin link</option></select>
      <select class="i" id="fType" aria-label="Evidence type"><option value="">All evidence types</option><option value="third_party_verification">Third-party verification</option><option value="chain_of_custody_certificate">Chain-of-custody certificate</option><option value="origin_document_check">Origin documents</option></select>
      <select class="i" id="sort" aria-label="Sort"><option value="due">Sort: due soonest</option><option value="new">Sort: newest first</option><option value="sup">Sort: supplier A–Z</option></select>
    </div>
  </section>
  <div class="split"><section class="card list"><div class="tw"><table class="t" id="tbl"></table></div><div class="pg" id="pg"></div></section><aside class="card" id="detail"></aside></div>
</main>
<script type="module" src="../src/registry.js"></script>
</body>
</html>
