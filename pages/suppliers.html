<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarbonTrace Supplier Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../src/ui.css">
<link rel="stylesheet" href="../src/pages.css">
<style>
.att1{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:12px;padding:3px 8px;border-radius:7px;cursor:pointer}.att1:hover{border-color:var(--accent);color:var(--accent)}
.frow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);font:inherit;font-size:13px;padding:9px 11px;border-radius:9px;cursor:pointer;margin-top:6px}.frow:hover{border-color:var(--accent)}.frow svg{color:var(--accent);flex:none}
.frow span{min-width:0;flex:1}.frow span em{display:block;font-style:normal;color:var(--dim);font-size:11.5px}
/* Supplier Center: saved views (tabs) -> filters -> paged table; a row opens a side profile. Built for several hundred suppliers. */
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.views{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.views button{border:0;background:none;padding:10px 12px;color:var(--mut);font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.views button.on{color:var(--ink);border-bottom-color:var(--accent)}
.views em{font-style:normal;color:var(--dim);margin-left:6px;font-variant-numeric:tabular-nums}
.fb{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb .i{padding:7px 10px;font-size:12.5px}
.fb input.i{flex:1;min-width:200px}
.fb .seg{flex:none}
.bulk{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--ink);font-size:12.5px}
.bulk button{border:0;border-radius:7px;padding:5px 10px;background:rgba(255,255,255,.1);color:var(--ink);cursor:pointer;font-size:12px}
.bulk .sp{flex:1}
table.t tr.r{cursor:pointer;transition:background .15s}
table.t tr.r:hover{background:rgba(255,255,255,.03)}
table.t tr.r.on{background:rgba(255,255,255,.06)}
table.t td{vertical-align:middle}
.nm b{font-weight:500}.nm .sub{font-size:11.5px}
.smp{font-size:10.5px;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 4px;margin-left:6px}
.tier{font-family:var(--m);font-size:11.5px;color:var(--mut)}
.dq{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}.dq i{width:4px;height:10px;border-radius:1px;background:rgba(255,255,255,.12)}.dq i.on{background:var(--ink)}
.pg{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--mut);font-size:12.5px;padding-top:10px}
.pg button{border:1px solid var(--line2);background:none;color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}.pg button:disabled{opacity:.35;cursor:default}
#drawer{position:fixed;top:68px;right:16px;bottom:16px;width:min(380px,calc(100vw - 32px));padding:20px;z-index:15;overflow:auto;transform:translateX(calc(100% + 20px));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#drawer.open{transform:none}
#drawer .x{position:absolute;top:12px;right:12px;border:0;background:rgba(255,255,255,.07);border-radius:50%;width:28px;height:28px;color:var(--mut);cursor:pointer}
.chain{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chain span{font-size:12px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.06)}
.foot{color:var(--dim);font-size:12px}
@media (max-width:900px){.kp{grid-template-columns:1fr 1fr}.hide-n{display:none}}
</style>
</head>
<body>
<header id="top"></header>
<main>
  <header class="ph"><div><h1>Suppliers</h1></div></header>
  <section class="kp" id="kp"></section>
  <section class="card" style="padding-top:6px">
    <div class="views" id="views"></div>
    <div class="fb" style="margin-top:14px">
      <input class="i" id="q" type="search" placeholder="Search name, ID or region" aria-label="Search suppliers">
      <select class="i" id="fMat" aria-label="Material"></select>
      <div class="seg" id="fTier"></div>
      <select class="i" id="fReg" aria-label="Region"></select>
      <select class="i" id="sort" aria-label="Sort">
        <option value="risk">Sort: needs attention first</option><option value="name">Sort: name A–Z</option>
        <option value="last">Sort: last activity, newest first</option>
      </select>
    </div>
    <div class="bulk" id="bulk" hidden style="margin-top:12px"></div>
    <div class="tw" style="margin-top:8px"><table class="t" id="tbl"></table></div>
    <div class="pg" id="pg"></div>
  </section>
</main>
<aside id="drawer" class="glass" aria-label="Supplier profile"></aside>
<script type="module" src="../src/suppliers.js"></script>
</body>
</html>
